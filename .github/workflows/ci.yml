name: CI

on:
  push:
    branches: [main, test-suite]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cpal and midir need ALSA headers on Linux
      - name: Install ALSA dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage scope and 90% line threshold per CLAUDE.md testing policy
      - name: Coverage
        run: >
          cargo llvm-cov
          --ignore-filename-regex 'src/(main\.rs|ui/|utils/audio_device_connector\.rs|midi/midi_device_connector\.rs)'
          --fail-under-lines 90
